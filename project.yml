name: AgentHourglass
options:
  bundleIdPrefix: cc.kuoc
  deploymentTarget:
    macOS: "14.0"
packages:
  UsageCore:
    path: .
targets:
  AgentHourglass:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: UsageCore
        product: UsageCore
      - package: UsageCore
        product: UsageCoreMac
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Agent Hourglass
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.kuoc.agent-hourglass
        PRODUCT_NAME: AgentHourglass
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
